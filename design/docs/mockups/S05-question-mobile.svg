<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
    <rect width="390" height="844" fill="#f6f9fc"/>
    <text x="24" y="70" font-family="Inter,Arial" font-size="28" font-weight="800" fill="#12233f">S05-question — Question Flow</text>
    <text x="24" y="100" font-family="Inter,Arial" font-size="14" fill="#64748b">One question at a time • progress, back and exit</text>
    <rect x="24" y="180" width="342" height="110" rx="16" fill="#ffffff" stroke="#dbe5ef"/>
        <text x="46" y="212" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#12233f">Question 2 of 5</text>
        <text x="46" y="240" font-family="Inter,Arial" font-size="13" fill="#64748b">Solve: 3(x − 2) = 15. Select the correct answer.</text><rect x="24" y="308" width="342" height="110" rx="16" fill="#ffffff" stroke="#dbe5ef"/>
        <text x="46" y="340" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#12233f">Answer controls</text>
        <text x="46" y="368" font-family="Inter,Arial" font-size="13" fill="#64748b">A) 3   B) 5   C) 7   D) 9</text><rect x="24" y="436" width="342" height="110" rx="16" fill="#ffffff" stroke="#dbe5ef"/>
        <text x="46" y="468" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#12233f">Navigation</text>
        <text x="46" y="496" font-family="Inter,Arial" font-size="13" fill="#64748b">Previous / Next. Exit opens a confirmation before leaving.</text><rect x="24" y="564" width="342" height="110" rx="16" fill="#ffffff" stroke="#dbe5ef"/>
        <text x="46" y="596" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#12233f">Submission error</text>
        <text x="46" y="624" font-family="Inter,Arial" font-size="13" fill="#64748b">If saving the answer fails, keep the answer and offer Retry.</text>
    <rect x="24" y="692" width="190" height="46" rx="12" fill="#2563eb"/>
    <text x="119" y="721" text-anchor="middle" font-family="Inter,Arial" font-size="14" font-weight="700" fill="white">Next question</text>
    </svg>