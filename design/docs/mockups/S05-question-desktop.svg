        <text x="302" y="468" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#12233f">Navigation</text>
        <text x="302" y="496" font-family="Inter,Arial" font-size="13" fill="#64748b">Previous / Next. Exit opens a confirmation before leaving.</text><rect x="280" y="564" width="1120" height="110" rx="16" fill="#ffffff" stroke="#dbe5ef"/>
