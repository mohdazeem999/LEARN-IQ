        <text x="302" y="240" font-family="Inter,Arial" font-size="13" fill="#64748b">Solve: 3(x − 2) = 15. Select the correct answer.</text><rect x="280" y="308" width="1120" height="110" rx="16" fill="#ffffff" stroke="#dbe5ef"/>
        <text x="302" y="340" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#12233f">Answer controls</text>
